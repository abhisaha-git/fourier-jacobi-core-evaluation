name = "fourierJacobi"
version = "0.1.0"
buildDir = '../fourier-jacobi-lean/.lake/build'
packagesDir = '../../.lake/packages'
defaultTargets = ["FourierJacobi", "Solution"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

[[lean_lib]]
srcDir = '../../publications/fourier-jacobi-core-evaluation'
name = "FourierJacobi"

[[lean_lib]]
srcDir = '../../publications/fourier-jacobi-core-evaluation'
name = "StatementAudit_v1"

[[lean_lib]]
srcDir = '../../publications/fourier-jacobi-core-evaluation'
name = "Solution"

# The statement template contains only the four intentional theorem holes.
# It is checked separately, without --wfail; it is never imported by Solution.
[[lean_lib]]
srcDir = '../../publications/fourier-jacobi-core-evaluation'
name = "Challenge"
