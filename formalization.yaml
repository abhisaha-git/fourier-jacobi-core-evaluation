fidelity:
  divergences: >-
    Explicit-kernel result only; no spherical-coefficient or full-period bridge.
    Arbitrary characteristic with residue cardinality q > 2. Regular unitary
    alpha,beta with alpha,beta != 1, alpha != beta, alpha*beta != 1.
    With t=q^(-1/2), integrability requires 0<T<=1, t<=|delta|<=1,
    T*t<|delta|; the undamped evaluation requires t<|delta|<=1.
    At delta=epsilon*t, epsilon=+/-1, additionally alpha,beta != epsilon;
    only the damped integral and signed Abel limit are claimed. The epsilon=1
    factor vanishes identically. No novelty claim or wall extension is made.
