version: v0.4
project:
  name: Explicit Fourier–Jacobi Haar-core evaluation and Abel limits
  description: >-
    For a nonarchimedean local field with residue cardinality q > 2, this
    development evaluates a sum of three normalized Haar integrals of an
    explicit eight-term Weyl kernel defined from valuations of entries and
    two-by-two minors of a concrete 4 by 4 matrix. It proves measurability and
    Bochner integrability on the natural damped range, an explicit rational
    evaluation in the undamped interior, principal Abel convergence, and the
    whole signed special Abel limit at delta = plus or minus q^(-1/2).
    The Satake parameters are unitary and avoid the stated Weyl walls; the
    special quotient also excludes parameters equal to its sign. The proof
    assembles all fifty infinite valuation regions with the source Haar
    normalizations. This adapts local calculations in Paul, Pitale, Saha and
    Schmidt's Fourier–Jacobi period paper. Identification of the explicit
    kernel with the paper's independently defined spherical coefficient and
    the full period identity are not claimed. The positive special-sign
    product is identically zero. No undamped special-endpoint integrability
    or extension to exceptional parameter walls is asserted.
  authors: [Abhishek Saha]
  responsible_maintainers: [Abhishek Saha]
  license: Apache-2.0
classification:
  arxiv: [math.NT, math.RT]
  msc2020: [11F70, 11F85]
sources:
  - title: >-
      An explicit refined Gan–Gross–Prasad identity for Fourier–Jacobi
      periods of degree 2 Siegel cusp forms
    authors: [Biplab Paul, Ameya Pitale, Abhishek Saha, Ralf Schmidt]
    id: https://arxiv.org/abs/2608.26007
    type: paper
    location: Section 2, local core-integral and Weyl-sum calculations
    relationship: adapts
    note: >-
      The formalization treats the independently specified explicit matrix-index
      kernel, rather than asserting its identification with a spherical
      coefficient. Its source record includes the author's expanded Section 2
      and fifty-row transcription; the retained row normalizations and exact
      source hashes are described in PROVENANCE.md and docs/source-map.md.
      The field theorem allows arbitrary characteristic with q > 2; the source
      works in characteristic zero with odd residue cardinality. The principal
      comparison carries 2/(q+1), and the signed special comparison carries
      (1-epsilon)/(q+1). No endorsement by all paper coauthors is asserted.
  - title: Expanded Section 2 and corrected core-evaluation brief
    authors: [Abhishek Saha]
    id: PROVENANCE.md
    type: other
    location: docs/statement.md; docs/proof.md; docs/source-map.md; data/source-row-restorations.json
    relationship: adapts
    note: >-
      Author-supplied project source material, with the original TeX/PDF hashes
      retained in verification/source-preservation.json. The original expanded
      document is not distributed here. The standalone formalized_theorem_v1.pdf
      and its TeX source state the full proved explicit-kernel result.
