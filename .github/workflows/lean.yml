name: Verify implemented lemmas

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proofs:
    name: Build and audit implemented lemmas
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install pinned local tools, build, and audit proofs
        run: .\scripts\setup-lean.ps1
      - name: Check that dependency pins were preserved
        run: git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
